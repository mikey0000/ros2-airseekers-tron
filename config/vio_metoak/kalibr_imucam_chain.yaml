%YAML:1.0

# Metoak stereo relative to its own IMU (ICM-40608, /stereo_imu/data, frame stereo_camera_imu).
#
# FACTORY extrinsics, no hand measurement: body_T_cam0 from the vendor VIO configs
# (src/mower_localization/vision_localization/config/metoak/sn*_euroc_stereo_imu.yaml, identical
# across units = mechanical constant): R_CtoI = diag(-1, 1, -1), p_CinI = (0.05143, -0.00453,
# -0.01503) m; cam1 = body_T_cam0 * T_cam0_cam1 from this unit's factory stereo calibration
# (ros2_port_handoff/08_calibration_identity/stereo_params.yaml). OpenVINS reads
# T_imu_cam as T_CtoI, which is exactly the vendor's body_T_cam form (no inversion).
# Checked at rest 2026-10-07: accel (-0.02, -9.78, +0.32) m/s^2 -> IMU y = camera y (down),
# consistent with this rotation. The same transform is in config/urdf/mower.urdf.xacro
# (stereo_camera_optical -> stereo_camera_imu).
#
# Intrinsics: factory cam0/cam1 K. Images: mono8 640x480, exact-stamp pair at 10 Hz from
# mower_cameras/stereo_cam.
# cam1 (fixed 2026-11-25, docs/vio.md 8.8): the factory stereo_params (Rx..Rz, Tx..Tz; Tx = -60 mm)
# are OpenCV stereoCalibrate's X_cam1 = R X_cam0 + T. generate_vio_config.py used them as the
# pose of cam1 in cam0, which put cam1 6 cm LEFT of cam0 and inverted the 0.5 deg rotation; on
# the first daylight bag OpenVINS then diverged and used ~0 features. Now
# T_C1toI = T_C0toI * [R^T | -R^T T]: cam1 is 60.05 mm right of cam0. Checked on that bag:
# left-right epipolar residual 0.39 px (the old pose: 3.2 px), disparity xL - xR > 0 (eyes are
# not swapped), cam0 rotation diag(-1, 1, -1) agrees with the gyro (hand-eye 0.10 deg median).
# Distortion: the factory model is radtan with k3 (~ -0.05); OpenVINS' radtan has no k3 and
# dropping it misplaced the outer image by 13 px (p90). An equidistant (Kannala-Brandt k1..k4)
# fit to the factory 5-coefficient model over the image: 0.09 px median, 0.5 px p99.
cam0:
  T_imu_cam: # R_CtoI, p_CinI  (translation units: meters)
    - [-1.0, 0.0, 0.0, 0.05143]
    - [0.0, 1.0, 0.0, -0.00453]
    - [0.0, 0.0, -1.0, -0.01503]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [1]
  camera_model: pinhole
  distortion_model: equidistant
  distortion_coeffs: [-0.04861242, -0.31712663, 0.68848962, -0.48853008] # k1..k4
  intrinsics: [449.6371155, 449.6687927, 319.9060974, 240.6614532] # fu fv cu cv
  resolution: [640, 480]
  rostopic: /vio/left/image_raw

cam1:
  T_imu_cam: # T_C0toI * T_cam0_cam1, T_cam0_cam1 = inverse of the factory (R, T) (above)
    - [-0.999963977, 0.007181077, 0.004525069, -0.008620472]
    - [0.007169149, 0.999970799, -0.002646655, -0.004686123]
    - [-0.004543943, -0.002614119, -0.999986259, -0.015306557]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [0]
  camera_model: pinhole
  distortion_model: equidistant
  distortion_coeffs: [-0.04922597, -0.31776976, 0.70515717, -0.51080941] # k1..k4
  intrinsics: [448.6719971, 448.6886902, 318.0475769, 238.3471069] # fu fv cu cv
  resolution: [640, 480]
  rostopic: /vio/right/image_raw
