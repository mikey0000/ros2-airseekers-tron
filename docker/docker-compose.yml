# Compose for the mower's Humble container.
# Run from ros2_stack/:  docker compose -f docker/docker-compose.yml <up|build|run ...>
# Serial map source: ros2_port_handoff/09_platform/dev_nodes.txt + udev-symlinks.txt
#   serial_mower->ttyS9 (mower MCU, raw 115200) | serial_imu->ttyS1 | serial_rtk->ttyS4
#   serial_ble->ttyS3 | serial_lte->ttyUSB2 (Quectel EC200A) | ttyUSB0/1 (modem/GNSS AT ports)
#   cameras: video44/53/62 (left_oa_camera / right_oa_camera / rear_camera)

services:
  mower_humble:
    build:
      context: ..
      dockerfile: docker/Dockerfile.humble
      network: host
    image: mower:humble
    container_name: mower_humble
    platform: linux/arm64
    privileged: true            # needs raw /dev + serial/ioctl access on the BSP kernel
    network_mode: host          # ROS 2 DDS discovery + Foxglove on LAN without port lists
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/work/install/mower_bringup/share/mower_bringup/config/cameras/fastdds_no_shm.xml
      - DISPLAY=${DISPLAY:-}
    volumes:
      # ROS 2 workspace sources (bind-mount; built inside container by scripts/build.sh)
      - ..:/work
      # Full /dev bind covers udev symlinks + hotplug (ttyUSB*, video*); explicit
      # `devices:` below pins the load-bearing serial ports even if /dev churns.
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Persistent state on the device's /userdata partition: calibration
      # (imu_cal -> /userdata/ros2/calibration/imu_calibration.yaml) and maps.
      - /userdata/ros2:/userdata/ros2
      # NPU runtime for det_ros/seg_ros: run scripts/install_models.sh --runtime first, then uncomment.
      - /userdata/ros2/lib/librknnrt.so:/usr/lib/librknnrt.so:ro
      # Vendor NTRIP credentials file (optional, read by um960_gps_driver when set)
      - /userdata/mower:/userdata/mower:ro
      # MowgliNext map_server default map directory.
      - /userdata/ros2/maps:/ros2_ws/maps
    devices:
      - /dev/ttyS9:/dev/ttyS9     # serial_mower (mower MCU)
      - /dev/ttyS1:/dev/ttyS1     # serial_imu
      - /dev/ttyS4:/dev/ttyS4     # serial_rtk
      - /dev/ttyS3:/dev/ttyS3     # serial_ble
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
      - /dev/ttyUSB2:/dev/ttyUSB2 # serial_lte (Quectel)
    # Runs the whole stack (launch/mower.launch.py via mower_bringup). The
    # workspace must already be built in /work/install (scripts/build.sh).
    # For an interactive shell instead: scripts/run_stack.sh shell
    # Fast DDS leaks its shared-memory segments on every restart; /dev/shm is the HOST tmpfs (bind-mounted
    # /dev). A full /dev/shm breaks every node (SHM transport errors, UDP fallback, RAM pressure), so wipe
    # the stale segments before launching (scripts/shm_gc.sh: removes only fastrtps_* files that no process
    # maps; `fastdds shm clean` is not in the image). A background loop repeats it every 5 min. Note: tmpfs
    # size/shm_size cannot cap this: /dev is bind-mounted from the host, so /dev/shm is the host's 2 GB tmpfs.
    command: >-
      bash -lc "source /opt/ros/humble/setup.bash &&
      source /work/install/setup.bash &&
      MIN_AGE=0 /work/scripts/shm_gc.sh ;
      (/work/scripts/shm_gc.sh --loop 300 &) ;
      exec ros2 launch mower_bringup mower.launch.py"
    restart: unless-stopped
