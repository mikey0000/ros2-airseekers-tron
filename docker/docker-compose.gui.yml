# MowgliNext web GUI (GPLv3, vendored at third_party/mowglinext/gui) for the
# Tron port. Overlay on top of the main stack -- run from ros2_stack/:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.gui.yml up -d
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.gui.yml up -d mower_gui   # GUI only
#
# Build the image first:  ARCH=arm64 ./gui/build.sh   (-> mower-gui:arm64)
# then copy it to the mower: docker save mower-gui:arm64 | ssh <mower> docker load
# See docs/gui.md. Serves http://<mower-ip>:4006 ; talks to ROS only through
# foxglove_bridge (ws://localhost:8765) and the teleop relay (8766).
#
# SECURITY: the Docker socket is mounted read-write so the GUI can restart
# the stack ("Restart ROS 2"), list containers and stream their logs. Access
# to docker.sock is root-equivalent on the host. Acceptable for a
# single-owner robot on a private LAN (the GUI API has no auth layer); do not
# expose port 4006 beyond that. NOT granted: /dev, privileged, pid: host.

services:
  mower_gui:
    # On an amd64 dev box use `image: mower-gui:latest` (./gui/build.sh with no
    # ARCH) and drop/override `platform`.
    image: mower-gui:arm64
    platform: linux/arm64
    container_name: mower_gui
    network_mode: host
    restart: unless-stopped
    environment:
      - FOXGLOVE_URL=ws://localhost:8765
      - MOWER_YAML_CONFIG_FILE=/mowgli_config/mowgli_robot.yaml
      - DB_PATH=/db
      - ONBOARDING_COMPLETED=true
      # GUI robot profile until mowgli_robot.yaml sets mower_model
      # (GET /api/robot/profile; web/src/constants/robotProfiles.ts).
      - ROBOT_PROFILE=AirseekersTron
      # Camera page (/api/cameras): web_video_server from cameras.launch.py
      # (host network). Overridden by perception_settings.camera_stream_base_url
      # in mowgli_robot.yaml; camera list override: CAMERAS='[{"id":..,"label":..,"topic":..}]'.
      - CAMERA_STREAM_BASE_URL=http://localhost:8080
      # Container names the GUI restarts / reads logs from (upstream defaults
      # are mowgli-ros2 / mowgli-gps / mowgli-gui). Empty GPS = no GPS sidecar.
      - DOCKER_HOST=unix:///var/run/docker.sock
      - ROS_CONTAINER_NAME=mower_humble
      - GUI_CONTAINER_NAME=mower_gui
      - GPS_CONTAINER_NAME=
      - MQTT_ENABLED=false
      - HOMEKIT_ENABLED=false
      # Custom map imagery (drone orthomosaics, docs/custom_imagery.md).
      - MAP_TILES_DIR=/map_tiles
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /userdata/ros2/gui_db:/db
      - ../config/gui:/mowgli_config
      - /userdata/ros2/maps:/ros2_ws/maps
      - /userdata/ros2/map_tiles:/map_tiles
