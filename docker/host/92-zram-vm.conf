# /etc/sysctl.d/92-zram-vm.conf on the mower HOST, paired with zram-swap.service.
# zram is cheap to swap to (RAM, no eMMC), so prefer swapping cold anonymous pages over
# dropping executable/page-cache pages (the refault storm that froze the mower 2026-10-22).
vm.swappiness = 150
# zram has no seek cost: read one page at a time instead of 8-page clusters.
vm.page-cluster = 0
