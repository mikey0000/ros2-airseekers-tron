# /etc/sysctl.d/91-ros2-cores.conf on the mower HOST (docs/crash_recovery.md).
# Core dumps of crashing processes (the Humble container shares the host kernel, so this
# pattern is global) go to the /userdata partition, which the container bind-mounts at the
# same path. Replaces the default "|/lib/systemd/systemd-coredump ..." pipe, which stores
# cores on the ~full root filesystem. %e = executable (15 chars), %p = pid, %t = epoch s.
# The size limit is per process: the container entrypoint sets `ulimit -c unlimited`;
# host processes keep their default (0 = no core) unless their unit sets LimitCORE.
kernel.core_pattern = /userdata/ros2/crashes/core.%e.%p.%t
# Append the pid only via the pattern above (not as an extra suffix).
kernel.core_uses_pid = 0
