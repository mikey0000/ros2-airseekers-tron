# Parameters for mower_map map_server_node (see README.md for the full list).
map_server_node:
  ros__parameters:
    maps_dir: /ros2_ws/maps
    map_frame: map
    base_frame: base_footprint
    blade_frame: blade_link
    resolution: 0.1
    mask_margin: 2.0
    obstacle_margin: 0.0
    lethal_outside_areas: true
    dock_keepout: true          # mowing mask only; never in /nav_keepout_mask
    nav_margin_m: 0.8           # nav mask: areas grown so recovery/docking can plan from a
                                # robot that stopped just outside the boundary (soft margin 0.3 m
                                # + half footprint). The MOWING mask is unaffected.
    path_margin_m: 0.15         # nav mask: navigation areas / drawn paths grown by this only
                                # (not nav_margin_m) so the planner follows the drawn band
    nav_obstacle_margin_m: 0.10 # nav mask: obstacles grown by this
    dock_corridor_enabled: true # nav mask: free dock -> approach -> nearest area capsule
    dock_corridor_soft_with_paths: true  # user path exists: approach->area leg costs 90, not free
    prefer_paths_in_areas: true # user path exists: mowing areas cost area_transit_cost outside path bands
    area_transit_cost: 60       # 0..99 (static layer maps 60 -> ~151 < inscribed 253); > path_edge_cost
    path_edge_cost: 30          # drawn path band: 0 on the centreline rising to this at the edge (0 = flat)
    dock_corridor_max_m: 5.0    # max approach->area gap bridged by the corridor
    approach_distance: 0.8      # keep equal to mower_docking approach_distance
    nav_soft_band_m: 1.5        # nav mask: cells this far outside the free set cost 90 (not lethal)
    return_corridor_enabled: true  # nav mask: free robot -> nearest free cell while off the map
    return_corridor_max_m: 15.0 # longer gap: warn, no corridor
    blade_radius: 0.15
    odom_topic: /odometry/filtered_map
    status_topic: /mower_base/status
    gps_status_topic: /gps/status
    soft_boundary_margin_m: 0.3  # outer ring is now 0.20 m inside the edge (coverage border_inset_m)
    lethal_boundary_margin_m: 0.5
    # 10 Hz x 2 samples = 0.2 s (0.06 m at 0.3 m/s) to confirm a soft violation. 5 Hz x 3
    # (0.6 s, 0.18 m) used up almost the whole 0.2 m soft->lethal gap: run B 10-06 went
    # soft -> lethal in 0.14 s, so the soft pause never got a chance.
    boundary_check_rate_hz: 10.0
    boundary_debounce_samples: 2
    lethal_min_duration_s: 1.0   # lethal must persist this long (one bad pose never latches)
    pose_jump_max_m: 2.0         # map pose > 2 m from the last accepted one within 1 s: ignored
    pose_jump_window_s: 1.0
    require_charging: true
    require_rtk_accuracy: true
    require_yaw_converged: true
    dock_set_gps_accuracy_max_m: 0.04
    dock_gates_override: false
