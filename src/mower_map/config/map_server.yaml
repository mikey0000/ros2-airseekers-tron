# Parameters for mower_map map_server_node (see README.md for the full list).
map_server_node:
  ros__parameters:
    maps_dir: /ros2_ws/maps
    map_frame: map
    base_frame: base_footprint
    blade_frame: blade_link
    resolution: 0.1
    mask_margin: 2.0
    obstacle_margin: 0.0
    lethal_outside_areas: true
    dock_keepout: true          # mowing mask only; never in /nav_keepout_mask
    nav_margin_m: 0.8           # nav mask: areas grown so recovery/docking can plan from a
                                # robot that stopped just outside the boundary (soft margin 0.3 m
                                # + half footprint). The MOWING mask is unaffected.
    nav_obstacle_margin_m: 0.10 # nav mask: obstacles grown by this
    dock_corridor_enabled: true # nav mask: free dock -> approach -> nearest area capsule
    dock_corridor_max_m: 5.0    # max approach->area gap bridged by the corridor
    approach_distance: 0.8      # keep equal to mower_docking approach_distance
    blade_radius: 0.15
    odom_topic: /odometry/filtered_map
    status_topic: /mower_base/status
    gps_status_topic: /gps/status
    soft_boundary_margin_m: 0.3  # headland ring runs on the polygon edge; 0.0 pauses every outer lap
    lethal_boundary_margin_m: 0.5
    boundary_debounce_samples: 3
    require_charging: true
    require_rtk_accuracy: true
    require_yaw_converged: true
    dock_set_gps_accuracy_max_m: 0.04
    dock_gates_override: false
