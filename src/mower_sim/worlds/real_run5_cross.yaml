# real_run5 with Area 1 on the cross pattern (2026-11-11, owner report "I don't see the second
# pass"): written to the sim's maps/area_settings.yaml. Auto start direction + the default
# 90 deg cross angle, so the second run is the bridge's perpendicular re-plan. Geometry, dock
# and paths as real_run5 (the real map, unchanged).
name: real_run5_cross
datum: {lat: 48.0, lon: 9.0}
areas_file: real_run5_areas.dat
areas_select: [Area 1, Dock path, Path 2, Path 3]
lawn_area: Area 1
dock: {x: 0.236, y: -0.637, yaw: 1.773}
start: {docked: true}
obstacles: []
battery: {voltage: 25.0, percentage: 0.9}
area_settings:
  Area 1: {path_mode: cross}
