# 2026-11-25 coast mode (docs/analysis/2026-11-25_coast_mode.md): the real_run5 world (flat, no
# terrain) with a 15 s RTK SINGLE dropout in the middle of an interior row: the sim's 'blade'
# anchor is about 66 s before the mow's first blade on, and sub-path 3's row from (-1.00, 3.74)
# to (-4.59, -0.53) runs about 121-133 s after it (coast-l-s1 2026-11-25), so t0 191 s.
#   RTK FIXED -> SINGLE 15 s (gps_gate drops it; ekf_map sigma 0.5 m: degraded) -> FIXED.
# Expected with coast_enabled: no hold, the mower coasts through on dead reckoning at the
# degraded speed cap with the blade on (criterion k "coasted through"); with coast_enabled
# false (or master): hold within 3 s, resume 5 s after FIXED returns.
# Gate: SIM_GATE_OUT=<abs> ./scripts/sim_gate.sh -w src/mower_sim/worlds/real_run5_coast.yaml \
#   -n coast -l -x 3 -s 1 -t 4000
name: real_run5_coast
datum: {lat: 48.0, lon: 9.0}
areas_file: real_run5_areas.dat
areas_select: [Area 1, Dock path, Path 2, Path 3]
lawn_area: Area 1
dock: {x: 0.236, y: -0.637, yaw: 1.773}
start: {docked: true}
obstacles: []
battery: {voltage: 25.0, percentage: 0.9}
rtk:
  anchor: blade
  ekf_sigma_m: 0.5
  events:
    - {t0: 191.0, dur: 15.0, kind: single, ekf_sigma_m: 0.5}
