# real_run5 with Area 1's boundary smoothed (2026-11-09, ws/smooth1109): real_run5_smooth_areas.dat
# is `ros2 run mower_map smooth_areas real_run5_areas.dat --out real_run5_smooth_areas.dat`
# (inner-hull smoothing at the default 0.08 m: Area 1 18 -> 14 vertices, max 0.073 m inward,
# -0.14 m2); everything else as real_run5.yaml. docs/analysis/2026-11-09_boundary_smoothing.md
name: real_run5_smooth
datum: {lat: 48.0, lon: 9.0}     # sim datum (UTM central meridian); geometry is map metres
areas_file: real_run5_smooth_areas.dat
areas_select: [Area 1, Dock path, Path 2, Path 3]
lawn_area: Area 1
dock: {x: 0.236, y: -0.637, yaw: 1.773}
start: {docked: true}
obstacles: []
battery: {voltage: 25.0, percentage: 0.9}
