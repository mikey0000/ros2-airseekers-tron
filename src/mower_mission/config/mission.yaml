# mower_mission parameters (node name: behavior_tree_node).
# Keep floats written as floats (30.0, not 30): rclpy refuses a type change.
behavior_tree_node:
  ros__parameters:
    tick_hz: 10.0                     # guard + phase evaluation rate (upstream BT tick)

    # --- emergency -------------------------------------------------------
    emergency_timeout_s: 2.0          # /hardware_bridge/emergency silence => emergency

    # --- battery ---------------------------------------------------------
    battery_low_percent: 20.0         # preflight minimum and low-battery threshold (vendor 20 %)
    battery_full_percent: 95.0        # charge hold ends here, then mowing resumes
    battery_low_action: stop          # below battery_low_percent during a mission: stop (blade off, stay put) | dock
    battery_max_charge_percent: 100.0 # charge limit while docked (e.g. 80.0); 100 = no limit
    battery_charge_hysteresis_percent: 5.0  # re-enable charging at max - this

    # --- GNSS ------------------------------------------------------------
    preflight_min_fix_type_docked: 1  # GnssStatus.fix_type needed to START from the dock
    rtk_fix_type: 3                   # WAITING_FOR_RTK needs RTK fixed
    rtk_timeout_s: 120.0              # then the run is aborted (and the mower docks)

    # --- heading (mower_localization/heading_aligner, /heading_aligner/status) ---
    # Nav2 needs an absolute heading; the JY61P yaw is arbitrary until aligned.
    require_heading_alignment: true   # source dock|cog required before PLANNING/TRANSIT
    heading_status_timeout_s: 5.0     # stale status = not aligned
    heading_wait_s: 30.0              # after undock + RTK: wait for COG, then stop (no Nav2)
    # Heading calibration drive (2026-10-13). START off the dock without an aligned heading
    # but with a saved one whose IMU continuity held (aligner file_check yaw_ok: the stack
    # restarted, only the position check is unproven): once RTK is fixed, drive a short
    # straight line so the aligner gets a COG fix, then plan as a normal START. Blade off;
    # Nav2 DriveOnHeading (forward) / BackUp (reverse) on the twist_mux nav lane with their
    # costmap check; the mission stops it on an obstacle in the line (obstacle_policy),
    # bumper / e-stop / motion gate act as always. The straight (distance + footprint,
    # +-cone, robot width) must lie inside one mowing area and outside its keepouts by the
    # SAVED heading, ahead first, else behind, else START is refused. No saved heading (or
    # the IMU restarted) -> refused as before: drive 1 m in manual or start from the dock.
    heading_calibration_drive: true
    heading_calibration_distance_m: 1.0     # one 0.6 m COG window at RTK fixed + run-up
    heading_calibration_speed_mps: 0.15
    heading_calibration_timeout_s: 45.0     # whole drive incl. the Nav2 resume wait
    heading_calibration_cone_deg: 10.0      # saved-heading error the map check tolerates
    heading_calibration_settle_s: 3.0       # RTK fixed this long first: the saved heading
                                            # may verify on its own (no drive needed)
    heading_calibration_status_wait_s: 3.0  # after the drive: wait this long for the COG fix
    # Stale / poor COG heading at START (2026-10-14: the second START planned on "aligned
    # (cog)" with quality poor and a 1200 s old fix and drove its transit 65 deg off). Off
    # the dock, a cog heading whose COG age (aligner status: the older of last_cog_age_s and
    # age_s) exceeds heading_max_cog_age_s, or whose quality is in heading_reject_quality,
    # is not good enough to plan on: it is treated like the saved 'file' heading above
    # (calibration drive, then plan; no clear line / drive disabled -> START refused, idle in
    # place). Dock / rtk / file_verified headings and START from the dock are unaffected.
    heading_max_cog_age_s: 300.0            # 0 = no age limit
    heading_reject_quality: ['poor']        # status quality values (good|fair|poor); [''] = none

    # --- localization hold (2026-10-09, /localization/status from localization_monitor) ---
    # Mow follow / transit stop with the blade off while the drift estimate is over budget
    # (RTK float / dropout on wheel + IMU + VIO); resume after RTK fixed brings it back to ok.
    loc_hold: true
    loc_status_timeout_s: 5.0         # stale / never-seen status: no new hold
    loc_resume_s: 3.0                 # 'ok' this long before resuming
    loc_hold_max_s: 600.0             # then stop in place (IDLE, resume cursor kept)

    # --- rain ------------------------------------------------------------
    rain_mode: 1                      # 0 ignore, 1 dock and wait
    rain_debounce_s: 2.0
    rain_delay_minutes: 30.0          # dry time before resuming

    # --- docking ---------------------------------------------------------
    use_docking_server: true          # false: undock with /backup + /charging, dock = nav to dock_pose
    undock_distance_m: 0.8            # vendor undock_point (0.8, 0)
    manual_undock_distance_m: 0.5     # standalone UNDOCK button (Command 9)
    undock_speed_mps: 0.15
    dock_use_vision: true
    dock_timeout_s: 180.0             # passed in the Dock goal
    dock_contact_grace_s: 10.0        # contacts seen while the dock action still runs: wait this long for its result, then cancel + treat as docked
    use_dock_pose: false              # only used when use_docking_server is false
    dock_pose_x: 0.0
    dock_pose_y: 0.0
    dock_pose_yaw: 0.0

    # --- coverage --------------------------------------------------------
    mow_angle_deg: -1.0               # < 0 = planner picks; only for areas whose own mow_angle_deg is auto
    transit_gap_m: 0.6                # blade-off /navigate_to_pose transit beyond this gap
    # 2026-10-09 route graph (docs/route_graph.md): transits drive map_server's plan_route
    # (drawn paths along their centreline, in-area legs inside the area) via FollowPath and
    # fall back to /navigate_to_pose on no route / a route abort; false = Nav2 only
    route_transits: true
    route_dock: true                  # return-to-dock: route to the approach pose first
    # Task 0.4 (e), run 3: the dock route aborted and the docking server's own navigate_to_pose
    # crossed the grass to the approach pose. The docking server is started only within
    # dock_server_nav_max_m of the approach pose (dock + dock_approach_distance_m along the
    # dock yaw; mirrors map_server corridor_half_width_m); farther, the dock route is planned
    # and driven again from the current pose (dock_route_retries), then NAV_TO_DOCK_FAILED in
    # place. An obstacle abort of the dock route waits first (blocked wait). 0.0 = old hand-over.
    dock_server_nav_max_m: 0.35
    dock_approach_distance_m: 0.8     # = map_server / mower_docking approach_distance
    dock_route_retries: 2
    route_controller_id: FollowPath   # MPPI transit controller
    route_goal_checker_id: general_goal_checker
    route_end_tolerance_m: 0.5        # route follow "success" farther from the target = failed
    route_blocked_retries: 1          # obstacle abort: blocked wait, re-send the route this often, then Nav2
    route_split_turn_deg: 100.0       # route sent as FollowPath legs split at turns sharper than this
    # 2026-10-14 fix 11 (run 2: MPPI stalled at the dock-path -> area-path hairpin, the
    # /navigate_to_pose fallback drove 0.56 m off the drawn path). Route cusp = the route
    # reverses by more than route_cusp_angle_rad (2.0 ~ 115 deg; a 90 deg corner is not one),
    # incl. a route-leg junction turning that much. A route follow abort / timeout within
    # route_cusp_radius_m of a cusp: cancel, pivot in place with Nav2 Spin (behavior_server,
    # nav lane) to the route direction after the cusp, re-send the route from the cusp. At
    # most route_cusp_retries about-turns per cusp (per sub-path transit), then a transit
    # abort (transit_retries) -- never the costmap planner at a cusp. 0 = old fallback.
    # task 0.4 (d), run 3: the start abort was 0.75 m past the junction, outside 0.5 m
    route_cusp_radius_m: 1.0
    route_cusp_angle_rad: 2.0
    route_cusp_retries: 2
    route_cusp_spin_rps: 0.2          # Spin time allowance = |angle| / this + 10 s (turf slip)
    # Task 0.4 (d), run 3 (owner: "in sharp corners it could reverse and turn rather than
    # overshoot"): the route is split at every corner sharper than this (rad, also below
    # route_split_turn_deg), and before a route leg (transit or dock route) starting within
    # route_cusp_radius_m whose heading is more than this off the robot's yaw the robot stops
    # and pivots in place (Nav2 Spin, route_cusp_spin_rps allowance) to the leg heading, then
    # follows it. One pivot per leg; a failed Spin still sends the leg. 0.0 = off.
    route_corner_turn_rad: 1.5708
    # The costmap-planner fallback stays only for a start off the route graph and a route
    # abort away from any cusp, and is bounded: the robot's distance from the drawn network
    # (cross-track to the route it replaces; 0 inside a mowing area) is checked every tick
    # and above this the fallback is cancelled and counted as a transit abort. An off-graph
    # start (already farther off) is bounded once it got within the corridor, or when it
    # moves this much farther away. Mirrors map_server corridor_half_width_m (0.35).
    # 0.0 = unbounded.
    transit_fallback_max_offpath_m: 0.35
    route_variation: true             # per-run transit variation (area setting transit_variation)
    transit_arrived_radius_m: 0.3     # transit ABORT/timeout within this of the target = arrived
    transit_retries: 3                # failed transit: re-send (from the current pose) this many times
    transit_retry_delay_s: 3.0        # fallback retry wait when transit_retry_backoff_s is empty
    transit_retry_backoff_s: [3.0, 10.0, 30.0]  # genuine (no collision) transit/follow abort: wait before retry 1/2/3+
    # abort + "collision ahead" (collision_abort_window_s) or a fresh dynamic/static policy = BLOCKED:
    # hold (sub_state "path blocked: waiting (N s)"), no retry consumed
    blocked_wait_s: 60.0              # max blocked wait (transit / follow / docking)
    blocked_wait_home_s: 120.0        # ... while RETURNING_HOME
    blocked_resend_s: 5.0             # re-send the goal at most this often ...
    blocked_clear_s: 3.0              # ... and only once no "collision ahead" was logged for this long
    requeue_failed_transits: true     # sub-path dropped on transit failure: re-try once in the end-of-area pass
    # owner 2026-10-07: a ranged detection only stops / waits / detours when it lies in the
    # corridor along the next lookahead of the current follow/transit path (else advisory,
    # /mission/obstacle_decision); half-width = robot_width_m/2 + obstacle_path_margin_m
    # MOWING sub-paths and route transits use that corridor (the path the controller tracks).
    # 2026-10-13: /navigate_to_pose transits (detours, gaps, retries) and dock phases instead
    # sweep the footprint along the PREDICTED motion: constant applied /cmd_vel (else
    # /cmd_vel_nav) twist younger than obstacle_twist_max_age_s, for obstacle_sweep_horizon_s
    # (arc / straight / pivot); a TRANSIT standing still with no prediction keeps the line to
    # the target. Footprint robot_rear_m .. robot_front_m around base_link, +-robot_width_m/2,
    # grown by obstacle_path_margin_m; within its circumscribed radius + margin = always in the
    # path. A dynamic stop keeps judging with the twist it started with.
    obstacle_path_filter: true
    obstacle_path_lookahead_m: 2.0
    obstacle_path_margin_m: 0.25
    robot_width_m: 0.54
    obstacle_sweep_horizon_s: 2.0
    obstacle_twist_max_age_s: 0.5
    robot_front_m: 0.52
    robot_rear_m: 0.25
    blade_transit_sample_m: 0.2       # blade_policy continuous: in-area transit check step
    follow_retries: 3                 # follow_path abort/timeout: resume from the last reached pose
    clear_costmaps_on_retry: true     # clear Nav2 global+local costmaps before retries / recoveries
    # false (review 2026-10-09): retries clear only the LOCAL costmap; the global one holds the
    # stereo / det / bumper marks the replan must avoid (Nav2's BT still clears both as its
    # last recovery, and a stuck escape clears both).
    clear_global_costmap_on_retry: false
    return_home_on_incomplete: false  # sub-paths not mowed -> MOWING_INCOMPLETE; dock only if true
    follow_controller_id: FollowCoveragePath
    # reverse legs of reverse-then-curve swath turns (RPP allow_reversing, nav2_params.yaml)
    reverse_controller_id: FollowCoveragePathReverse
    follow_goal_checker_id: coverage_goal_checker
    # turn legs (reverse sub-paths + chunks <= turn_leg_max_m) need travel before "reached":
    # mowgli_nav2_plugins::LegGoalChecker ('' = follow_goal_checker_id for all)
    turn_leg_goal_checker_id: coverage_leg_goal_checker
    turn_leg_max_m: 1.2
    # 2026-10-13 swath-end pivots: a retry / stuck-escape resume of a turn leg (reverse
    # sub-path, or the forward piece ending at a reverse leg's cusp) the robot has all but
    # driven (within turn_leg_skip_m of its end, facing within turn_leg_skip_yaw rad of the end
    # pose) counts the leg as done and sends the next leg, instead of a 1-3 pose goal whose
    # first move is a turn in place. = coverage_leg_goal_checker overshoot_xy_tolerance /
    # yaw_goal_tolerance (nav2_params.yaml). 0 = off.
    turn_leg_skip_m: 0.20
    turn_leg_skip_yaw: 0.5
    # 2026-10-14 fix 10 (run 2: 7 min / ~4000 deg of MPPI looping on a 0.8 m turn leg whose
    # last pose was reached with the heading ~10 deg off). Turn leg (reverse leg, forward piece
    # ending at its cusp, or a sub-path <= turn_leg_max_m) whose end is reached in xy (tracked
    # pose index at the last pose, or within turn_leg_skip_m of the end pose): done, next leg
    # from here, after turn_leg_done_after_s OR turn_leg_done_after_rot_rad of accumulated
    # |yaw change| since, without the yaw test (a met end yaw stays with the leg goal checker
    # and the skip above, unchanged).
    # Both 0.0 = cap off.
    turn_leg_done_after_s: 20.0
    turn_leg_done_after_rot_rad: 6.28
    # Task 0.4 (f), run 3: the 49 m outer ring ends at a reverse leg's cusp and was capped;
    # progress_local jumped to its last pose 4.6 m early and 4.6 m of ring were skipped.
    # true: "end reached" = within turn_leg_skip_m of the leg end (never progress_local), and
    # only a leg whose OWN length <= turn_leg_max_m is capped. false = the fix 10 rule.
    turn_leg_end_by_distance: true
    # any sub-path: follow_path whose tracked pose index has not advanced for this long is
    # cancelled and handled as a follow_path abort (follow_retries); Nav2's progress checker
    # is satisfied by looping. Waits / holds / stuck escapes cancel the goal (timer restarts).
    # 0.0 = off.
    leg_loop_abort_s: 90.0
    max_areas: 200

    # --- per-area mowing settings (map_server_node/get_area_settings) -----
    use_area_settings: true           # false: built-in defaults for every area
    cut_width_m: 0.20                 # blade width; coverage_server operation_width = this - swath_overlap_m
    cut_speed_max_mps: 0.5            # cap on an area's cut_speed_mps
    controller_speed_param: FollowCoveragePath.desired_linear_vel   # set on /controller_server
    set_cut_speed: true
    set_cutter_height: true           # /cutter_control height (blade off) before planning an area
    alternate_state_path: /ros2_ws/maps/mission_alternate_counts.json   # path_mode alternate: angle step per area

    # --- blade (vendor OpenCutterCheck) -----------------------------------
    require_blade_confirmation: true  # wait for MowerBaseDevStatus.is_cutting before following
    blade_confirm_timeout_s: 5.0
    blade_start_attempts: 3
    blade_retry_pause_s: 2.0
    blade_spinup_s: 2.0               # fixed wait when confirmation is disabled
    # Manual mowing (HighLevelControl 7): true = MANUAL_MOWING starts with the blade OFF
    # (sub_state "joystick, blade off"); the blade starts only on ~/manual_blade(true)
    # (GUI mow_enabled=1, forwarded by mower_gui_bridge) and is vetoed by emergency /
    # lift / stop button / docked / charging. false = upstream (blade on at entry).
    manual_blade_requires_enable: true

    # --- boundary ----------------------------------------------------------
    boundary_recover_after_s: 3.0     # soft violation while MOWING: pause this long, then ...
    boundary_max_recoveries: 2        # ... up to this many blade-off recovery transits per sub-path
    boundary_recovery_advance_m: 1.0  # recovery target: this far ahead on the sub-path; then latch
    boundary_recovery_retries: 3      # a failing recovery transit is re-sent this often, then stop in place
    progress_window_m: 3.0            # progress / resume pose search window ahead on the path (m)
    follow_end_tolerance_m: 1.0       # follow_path "succeeded" with more path left => continue from progress
    follow_premature_retries: 3
    follow_chunk_m: 25.0              # FollowPath goals are split into chunks of at most this length (0 = off)
    follow_chunk_clearance_m: 0.5     # a chunk's final pose stays this far from its earlier poses

    # --- obstacle avoidance (/obstacle_policy from mower_vision obstacle_guard) ---
    # person/dog/cat (dynamic): stop, blade off, wait; everything else (static): on a
    # follow_path abort, blade-off /navigate_to_pose detour to the swath pose beyond the
    # obstacle, resume there; skipped stretches are re-tried once at the end of the area.
    obstacle_avoidance: true
    obstacle_policy_timeout_s: 1.0    # older /obstacle_policy = none
    dock_zone_radius_m: 2.0           # docking: ignore camera detections this close to the dock
    obstacle_static_memory_s: 3.0     # a static class seen this recently explains an abort
    dynamic_wait_s: 30.0              # then the dynamic obstacle is treated as static (detour)
    dynamic_wait_transit_s: 15.0      # transit / docking (blade off): wait, then re-send the goal
    dynamic_ignore_after_timeout_s: 60.0  # after a timeout: ignore the same class this long ...
    dynamic_ignore_move_m: 1.0        # ... unless the robot moved more than this
    dynamic_clear_hold_s: 2.0         # policy clear this long before resuming
    # per-area obstacle_detection (none|standard|sensitive) -> /obstacle_guard obstacle_detection
    # + /det_range publish_obstacle_points (false for none), pushed when an area's settings load
    set_obstacle_detection: true
    dynamic_wait_sensitive_factor: 2.0  # sensitive areas: dynamic waits x this
    stereo_stale_window_s: 2.0        # /rosout stale-stereo WARN this recent -> 'sensor stale' sub_state
    # 2.0 (was 1.0, 2026-10-09): the robot stops ~0.3 m short of an obstacle and its footprint
    # reaches 0.52 m ahead of base_link, so a pose 1.0 m on almost always put the goal footprint
    # inside the obstacle -> planner failure -> 1.5 / 2.0 / ... each burning a full Nav2
    # recovery cycle (the long "pause"). 2.0 clears a ~0.5 m deep obstacle at the first try.
    detour_skip_m: 2.0                # detour target this far along the sub-path past the robot
    detour_skip_step_m: 0.5           # detour transit failed: extend the skip by this ...
    detour_max_skip_m: 3.5            # ... up to this, then a normal follow retry
    max_detours_per_subpath: 5
    detour_max_leave_m: 0.0           # detour pose may be this far outside the area ring
    # 0 (was 1, 2026-10-09): the global costmap now carries the stereo / det_range / bumper marks,
    # so the detour plan really goes AROUND the obstacle; detour on the first costmap-collision
    # abort instead of first holding in "path blocked: waiting" and re-driving into it.
    detour_unclassified_after: 0      # abort without a ranged static obstacle: detour after N plain retries (-1 never), ONLY if it coincides with a costmap collision abort
    collision_abort_window_s: 5.0     # controller_server "collision ahead" (/rosout) this recent counts as a costmap collision abort
    pivot_sub_after_s: 3.0            # sub_state "turning (slow pivot)" after linear 0 / angular != 0 on /cmd_vel_nav this long
    requeue_skipped: true             # end-of-area pass over skipped stretches (blocked -> MOWING_INCOMPLETE)
    # stuck guard (mower_control slip_detector /stuck): cancel, blade off, escape on
    # /cmd_vel_emergency (reverse / forward 30 deg arc / reverse opposite arc), then resume;
    # too many / failed / same-spot -> STUCK_NEEDS_HELP (STOP / START / MANUAL clear it)
    lethal_agree_margin_m: 0.5        # map_server lethal held off while the mission pose is inside the area (+margin)
    lethal_disagree_max_s: 3.0        # ... for at most this long
    stuck_guard: true
    stuck_max_recoveries: 3
    stuck_recovery_period_s: 120.0
    stuck_pause_s: 1.0
    stuck_step_m: 0.3
    stuck_step_speed: 0.1
    stuck_arc_deg: 30.0
    stuck_step_progress_s: 3.0
    stuck_step_progress_m: 0.05
    stuck_escape_m: 0.3
    stuck_same_spot_m: 0.5
    stuck_same_spot_left_m: 1.0
    stuck_ignore_after_s: 1.0

    # --- tilt guard (2026-10-09; mower_control tilt_monitor /tilt/status) ----
    # The monitor filters / debounces the IMU roll + pitch into ok|caution|limit|critical
    # (thresholds, hysteresis, mount offset: tilt_monitor params, mower_control/tilt_logic.py).
    # caution: both controllers capped at tilt_caution_speed_mps, blade stays on.
    # limit (mission / docking phases): cancel, blade off, 'steep' terrain incident, back out
    #   along the driven track on /cmd_vel_emergency until the band drops (>= min, <= max m),
    #   then resume (mowing: detour past the spot). Same spot / too many -> STUCK_NEEDS_HELP.
    #   MANUAL_MOWING: blade off and refused, the operator keeps driving.
    # critical: emergency cause (tilt_monitor also zeroes /cmd_vel_emergency + /cutter_off).
    tilt_guard: true
    tilt_status_timeout_s: 2.0        # older /tilt/status -> band unknown, nothing acted on
    tilt_caution_speed_mps: 0.15
    # FollowPath.vx_max (2026-10-09): the transit controller is MPPI now (no desired_linear_vel;
    # vx_max is a dynamic MPPI param). Use FollowPath.desired_linear_vel with transit_controller:=rpp.
    tilt_transit_speed_param: FollowPath.vx_max
    tilt_transit_speed_mps: 0.3       # restored after caution: keep = nav2_params FollowPath
    tilt_trail_m: 2.0                 # driven track remembered for the back-out
    tilt_trail_step_m: 0.05
    tilt_backout_pause_s: 0.5
    tilt_backout_speed: 0.1
    tilt_backout_min_m: 0.3
    tilt_backout_max_m: 1.0
    tilt_backout_lookahead_m: 0.3
    tilt_backout_max_w: 0.3
    tilt_backout_progress_s: 3.0
    tilt_backout_progress_m: 0.05
    tilt_max_backouts: 3
    tilt_backout_period_s: 300.0
    tilt_same_spot_m: 0.75

    # --- recording ---------------------------------------------------------
    record_rate_hz: 10.0
    record_min_spacing_m: 0.05
    record_simplify_tolerance_m: 0.05
    record_close_radius_m: 0.5        # finish: cut the drive where it passes back within this of its start (overshoot spike)
    record_min_area_m2: 1.0
    record_min_obstacle_area_m2: 0.5   # CMD_RECORD_OBSTACLE (11): min ring of a recorded no-go zone
    record_max_points: 50000
    record_path_width_m: 0.7         # CMD_RECORD_PATH (10): band width of a recorded path
    record_path_min_length_m: 1.0
    recording_fallback_dir: ~/.ros/mower_mission/recordings   # polygon kept here if add_area fails

    # --- timeouts ----------------------------------------------------------
    result_display_s: 5.0             # UNDOCK_FAILED / NAV_TO_DOCK_FAILED / RECORDING_COMPLETE shown this long
    server_wait_timeout_s: 3.0        # wait_for_server / wait_for_service before "unavailable"
    # Nav2 readiness: the activity gate PAUSEs the Nav2 stack while idle, so a nav goal
    # waits for it to be active again (never longer than this) before being sent.
    nav2_active_service: /lifecycle_manager_navigation/is_active
    nav2_ready_timeout_s: 20.0
    service_timeout_s: 10.0
    plan_timeout_s: 120.0
    undock_timeout_s: 180.0
    transit_timeout_s: 300.0
    follow_timeout_s: 3600.0
    dock_action_timeout_s: 400.0

    # --- persistence / output ---------------------------------------------
    coverage_resume_path: /ros2_ws/maps/coverage_resume.txt   # compose mounts /userdata/ros2/maps here (persistent)
    map_frame: map
    status_rate_hz: 1.0
    zero_burst_s: 0.5                 # /cmd_vel_emergency zero burst on stop / emergency
    zero_burst_rate_hz: 20.0
