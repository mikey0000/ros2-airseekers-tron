# twist_mux 4.5.0 (ROS 2 Jazzy). Messages are geometry_msgs/Twist.
# Jazzy's twist_mux DEFAULTS to stamped messages (use_stamped=true) when the
# parameter is absent ("use_stamped is not declared as parameter, defaulting to
# true"): it then subscribes TwistStamped lanes and publishes a TwistStamped
# cmd_vel_out, silently dropping every command from the unstamped chain
# (cmd_vel_nav, cmd_vel_docking, cmd_vel_teleop, cmd_vel_emergency, bumper).
# The whole mower chain is unstamped Twist, so pin use_stamped false here.
# (PR ros-teleop/twist_mux#61 makes this safe: passing it no longer throws an
# ParameterAlreadyDeclaredException on 4.5.0.)
twist_mux:
  ros__parameters:
    use_stamped: false
    # Higher priority overrides lower while its topic is active within timeout.
    topics:
      navigation:
        topic: /cmd_vel_nav
        # Short timeouts everywhere: if a source dies, twist_mux must stop
        # republishing its last command quickly so the robot does not coast on
        # a stale command. 0.6 s still covers several periods of a 10 Hz
        # controller.
        timeout: 0.6
        priority: 10
      docking:
        topic: /cmd_vel_docking
        timeout: 0.5
        priority: 15
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.5
        priority: 20      # operator override beats navigation
      bumper:
        topic: /cmd_vel_bumper
        timeout: 0.5
        priority: 50
      emergency:
        topic: /cmd_vel_emergency
        timeout: 0.2      # tighter timeout for the safety-critical source
        priority: 100

    # std_msgs/Bool published by mower_mcu_driver; while true, twist_mux
    # blocks all lanes (outputs nothing).
    locks:
      estop:
        topic: /estop
        timeout: 0.0
        priority: 255
