# obstacle_guard: det_ros detections -> /vision/obstacle_close (+ optional stop).
# Danger zone: bbox bottom edge below y_frac*image_height AND bbox width > w_frac*image_width.
obstacle_guard:
  ros__parameters:
    detections_topic: /ai/det/detections
    # det_range output: preferred while it publishes (ranged_timeout_s); ranged detections
    # are close at <= obstacle_stop_range_m from range_origin_x_m (stereo lens x in
    # base_link), unranged ones use the image-space rule below.
    ranged_topic: /ai/det/detections_ranged
    ranged_timeout_s: 1.0
    obstacle_stop_range_m: 1.0
    range_origin_x_m: 0.466
    # Classes the guard reacts to (names from det_ros/labels.py, best_large_0208.rknn).
    whitelist: [person, dog, cat, hedgehog, rabbit]
    min_score: 0.4
    y_frac: 0.6
    w_frac: 0.15
    # Detection2DArray carries no image size: the guard reads it per frame_id from the
    # camera_info topics below. These are only the fallback until one arrives (OA cameras
    # publish 960x540 by default, cameras.launch.py oa_publish_width).
    camera_info_topics: [/left_oa_camera/camera_info, /right_oa_camera/camera_info, /vio/right/camera_info]
    image_width: 960
    image_height: 540
    hold_s: 0.5               # per-camera debounce
    stop_on_close: false      # true: 1 s zero burst on /cmd_vel_emergency + /cutter_off
    burst_s: 1.0
    burst_rate_hz: 20.0
    emergency_topic: /cmd_vel_emergency
    cutter_off_service: /cutter_off
    publish_markers: true
    # /obstacle_policy (std_msgs/String JSON, latched, policy_rate_hz) for mower_mission:
    # closest detection of any class; dynamic_classes within obstacle_stop_range_m ->
    # dynamic (stop, blade off, wait), any other class within policy_static_range_m ->
    # static (blade-off detour). Unranged boxes use the image-space rule above.
    dynamic_classes: [person, dog, cat]
    policy_static_range_m: 1.5
    policy_topic: /obstacle_policy
    policy_rate_hz: 5.0
    # Per-area level, set live by mower_mission from the area's obstacle_detection setting:
    #   none      = vision policy always kind none (bumper + stereo costmap only)
    #   standard  = ranged <= obstacle_stop_range_m (min_score); unranged need
    #               bbox height >= unranged_h_frac*image height; cameras by motion direction
    #   sensitive = sensitive_stop_range_m / sensitive_min_score, every camera counts
    obstacle_detection: standard
    sensitive_stop_range_m: 1.5
    sensitive_min_score: 0.35
    unranged_h_frac: 0.45     # ~person within 1.5 m on the 960x540 OA cameras
    # Motion relevance (unstamped Twist): front unless only reversing, a side camera only
    # while turning toward it, rear while reversing. '' = every camera always counts.
    cmd_vel_topic: /cmd_vel
    motion_lin_deadband_mps: 0.03
    motion_ang_deadband_rps: 0.15
    motion_hold_s: 0.6
    front_frames: [vio_camera]
    left_frames: [left_oa_camera]
    right_frames: [right_oa_camera]
    rear_frames: [rear_camera]   # hook: the rear camera is not run through det_ros yet
