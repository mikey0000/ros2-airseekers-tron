# GNSS smoothing overlay for ekf_map (2026-10-29, review B13-2; OFF by default).
#
# Loaded AFTER ekf_dual.yaml (+ ekf_dual_vio.yaml) only with the launch argument
# gnss_smoothing:=true (mower.launch.py -> nav2.launch.py). It changes ekf_map only:
#
# * x/y process noise 0.05 -> 1e-4 m^2/s. With the 3 cm fixed-RTK sigma the steady
#   Kalman gain per 10 Hz fix drops from 0.86 to about 0.1 (time constant ~0.9 s): wheels
#   and IMU carry the in-band motion (the 0.15 Hz weave), RTK the low frequencies.
#   Offline (10-28 bag, robot_localization replay with odom_linear_scale 1.06):
#   docs/analysis/2026-10-29_localisation_wander.md section 5.
# * initial_estimate_covariance x/y 1 m^2 (robot_localization's default is 1e-9): with
#   the low process noise a 1e-9 start would make the filter crawl from (0, 0) to the
#   first fix over tens of seconds; 1 m^2 lets the first fixes snap it into place.
#
# * odom0_config: also fuse vy (= 0, the wheels cannot slide sideways), with mcu_node's
#   /odom vx / vy variances tightened to 1e-4 by the same switch (bringup.launch.py). The
#   process noise alone does nothing in robot_localization: with the default loose odom
#   twist covariance (vx 0.02, vy unobserved) the velocity uncertainty, not the x/y
#   process noise, lets the position drift, and the pose keeps following RTK (bag replay:
#   q 1e-4 gave +4 % weave with the loose covariance, -47 % with the tight one).
#
# Costs: the pose departs from raw RTK by ~1-2 cm p90 (noise removal + lag), along-track
# bias = odometry scale error x speed x 0.9 s, and slower re-convergence after a GNSS
# gap or in RTK float (float fixes carry a 0.4 m sigma floor). Field A/B only; the sim
# has no EKF. Everything else (ekf_node, rates, sensors) is unchanged.
