# mower_cameras defaults — mirrored from ros2_port_handoff/08_calibration_identity/
# base_cameras_config/mower_cameras.yaml (rear 1920x1080 @ 30 fps) and the OpenVINS
# stereo config (14_vio_replacement/config/stereo_imu_config.yaml: 640x480, freq 10).
#
# Device map (ros2_port_handoff/README.md hardware table):
#   /dev/videoSimor (video11)   Metoak front stereo, side-by-side frames
#   /dev/rear_camera (video62)  rear USB UVC webcam (32e6:9221)
#
# The stereo device delivers one side-by-side frame; the node splits it in half,
# so `width`/`height` below are the *total* capture size (each eye is width/2).
# Set `left_device`/`right_device` instead to use two independent V4L2 devices.

mower_cameras:
  ros__parameters:
    stereo_device: '/dev/video11'
    left_device: ''
    right_device: ''
    rear_device: '/dev/rear_camera'

    width: 640
    height: 480
    fps: 10.0
    rear_width: 1920
    rear_height: 1080
    rear_fps: 30.0

    publish_compressed: true
    jpeg_quality: 80
    mono: false
