# Nav2 parameters for the Airseekers Tron (ROS 2 Humble, Nav2 1.1.x).
#
# Translated from third_party/mowglinext/mowgli_bringup/config/nav2_params_base.yaml
# (Kilted). Every deviation is marked "DEVIATION:" with the reason. Summary:
#
#   * Humble: unstamped Twist everywhere -> no `enable_stamped_cmd_vel` keys.
#   * No docking_server (opennav_docking is not in Humble), no collision_monitor
#     in this file yet (velocity chain is controller -> velocity_smoother ->
#     twist_mux lane), no smoother_server / waypoint_follower / map_server /
#     map_saver / coverage_server / AMCL.
#   * FollowCoveragePath = mowgli_nav2_plugins/FTCController and
#     coverage_goal_checker = mowgli_nav2_plugins/PathProgressGoalChecker, from
#     the Humble port in src/mowgli_nav2_plugins. FollowPath (transit) stays RPP.
#   * No LiDAR, no /map: global costmap has no static_layer; local costmap gets
#     an obstacle_layer fed only by /bumper_cloud.
#
# Frame contract (fixed):
#   map --(static identity for now)--> odom --(ekf_node)--> base_link (rear axle)
#   --(URDF identity)--> base_footprint.   Odometry: /odometry/filtered (odom frame).
#
# DEVIATION (all nodes): robot_base_frame is base_link, not MowgliNext's
# base_footprint. Our EKF's child frame is base_link and base_footprint is an
# identity child of it, so the two are interchangeable; base_link avoids one
# extra TF lookup and matches /odometry/filtered.child_frame_id.
#
# Footprint (from config/urdf/mower.urdf.xacro, base_link origin):
#   chassis box 0.7 x 0.5 centred at x=+0.12  -> x in [-0.23, +0.47], y +-0.25
#   drive wheels at y=+-0.24, width 0.05      -> outer y +-0.265
#   bumper box at x=0.507, 0.02 thick         -> front x +0.517
#   => [[0.52, 0.27], [0.52, -0.27], [-0.23, -0.27], [-0.23, 0.27]]
# NOTE: the xacro places the drive axle at x=-0.098 while base_link is documented
# as the rear-axle centre; if base_link moves to the axle, shift x by +0.098.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    # Same 1000 ms as MowgliNext: is_path_valid shares planner_server's callback
    # group and can exceed short timeouts on ARM.
    default_server_timeout: 1000
    wait_for_service_timeout: 10000
    transform_tolerance: 0.5
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml are injected
    # by navigation.launch.py (absolute paths into this package's
    # behavior_trees/). They are the Humble default trees plus
    # goal_checker_id="general_goal_checker" on FollowPath (see the XML headers).
    # DEVIATION: MowgliNext uses its own custom trees; we use the Humble defaults
    # until mowgli_behavior is ported.
    # DEVIATION: no enable_stamped_cmd_vel (Humble has unstamped Twist only).

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    # DEVIATION: MowgliNext reads /wheel_odom; our velocity feedback is the EKF.
    odom_topic: /odometry/filtered
    # DEVIATION: 20 Hz (MowgliNext 10 Hz): RPP on a 0.3 m/s mower is cheap.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5      # diff-drive: no lateral velocity
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # Humble key is progress_checker_plugin (singular); Iron+ uses the plural list.
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "coverage_goal_checker", "coverage_goal_checker_ftc"]
    controller_plugins: ["FollowPath", "FollowCoveragePath", "FollowCoveragePathFTC",
                         "FollowCoveragePathReverse"]
    # DEVIATION: no path_handler_plugins (Kilted-only API).

    # PoseProgressChecker (as MowgliNext): rotating in place counts as progress
    # (required_movement_angle), so an RPP rotate-to-heading near the goal is not
    # aborted as "Failed to make progress". The first real mow did exactly that
    # with SimpleProgressChecker (pure distance) at t=1791253104.
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.25
      required_movement_angle: 0.5
      movement_time_allowance: 20.0

    # Transit goals. DEVIATION: MowgliNext has stopped_goal_checker +
    # transit_goal_checker; collapsed into one SimpleGoalChecker per contract.
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.25 m / 0.5 rad: the mission hands off to FollowCoveragePath, which
      # re-acquires the path itself; 0.15 m left the robot dithering at
      # ~0.16 m (EKF jitter flips RPP between "rotate to goal yaw" and "rotate
      # to carrot"). stateful: once xy is reached, only yaw is checked.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5
      stateful: true

    # Requested by the mission (follow_goal_checker_id: coverage_goal_checker).
    # mowgli_nav2_plugins/PathProgressGoalChecker (Humble port in
    # src/mowgli_nav2_plugins): fires only after FTC has tracked >= 95 % of the
    # plan it republishes on /controller_server/FollowCoveragePath/global_plan
    # AND the robot is within xy tolerance. Yaw ignored at a swath end.
    # Coverage goal checker for FollowCoveragePath (RPP): end of the swath within 0.25 m,
    # yaw ignored. (2026-10-06: the FTC port veered off the first ring on the real mower;
    # RPP is the fallback until mowgli_nav2_plugins/FTCController is validated.)
    coverage_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14
      stateful: true
    # Goal checker for FollowCoveragePathFTC (mowgli_nav2_plugins): fires after FTC has
    # tracked >= 95 % of the plan it republishes AND the robot is within xy tolerance.
    coverage_goal_checker_ftc:
      plugin: "mowgli_nav2_plugins/PathProgressGoalChecker"
      progress_threshold: 0.95
      xy_goal_tolerance: 0.50
      yaw_goal_tolerance: 3.14
      plan_topic: "/controller_server/FollowCoveragePathFTC/global_plan"

    # Transit controller. DEVIATION: plain RPP with use_rotate_to_heading
    # instead of MowgliNext's RotationShim(RPP): one fewer plugin to tune,
    # RPP's own rotate-to-heading covers pivots on a diff-drive.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.8
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      # 3.2: RPP ramps its turn command from the MEASURED yaw rate; with 1.0 and wheels
      # stalled in grass the command sat at 0.07 rad/s forever (rocking in place, 10-06).
      max_angular_accel: 3.2
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

    # Coverage controller (mission.yaml follow_controller_id: FollowCoveragePath).
    # RegulatedPurePursuit tuned for 0.18 m swaths: short lookahead, no reversing,
    # slow pivots at swath ends. desired_linear_vel is set live from the area settings.
    FollowCoveragePath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      # 0.5/0.4/0.7 (was 0.4/0.3/0.6): the drive lags and caps the yaw rate, and the short
      # carrot made RPP weave (angular.z sign flips every 1-2 s at 0.3 m/s, 10-06 runs A/B).
      lookahead_dist: 0.5
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      # mower_mcu_driver clamps angular to 0.3 rad/s (vendor PID clamp): ask for no more.
      rotate_to_heading_angular_vel: 0.3
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      # Curvature-preserving turns: the MCU clamps linear and angular SEPARATELY (+-0.3) and
      # the chassis only reaches ~0.1-0.25 rad/s in turf, so RPP must slow down until
      # v / R <= ~0.2 rad/s itself. min_radius = desired_linear_vel / 0.2 = 1.5 m. At 0.5 m
      # it asked for 0.4-0.6 rad/s at 0.3 m/s; the robot turned on a >= 1.0-1.5 m radius
      # and ran wide (docs/analysis/2026-10-06_ring_drift.md).
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 0.08
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      # 3.2: RPP ramps its turn command from the MEASURED yaw rate; with 1.0 and wheels
      # stalled in grass the command sat at 0.07 rad/s forever (rocking in place, 10-06).
      max_angular_accel: 3.2
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

    # Reverse legs of reverse-then-curve swath turns (mower_coverage turn_type auto/reverse).
    # The coverage bridge cuts every backwards run into its own short sub-path whose poses
    # face AGAINST the travel; the mission (mission.yaml reverse_controller_id) sends it here.
    # Humble RPP drives backwards when the carrot is behind the robot (allow_reversing) and
    # silently DISABLES reversing if use_rotate_to_heading is also true, hence false here.
    # The leg is straight-ish and < ~0.6 m, so a short lookahead and a slow speed.
    FollowCoveragePathReverse:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.3
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.4
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.3
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: false
      max_angular_accel: 3.2
      allow_reversing: true
      max_robot_pose_search_dist: 2.0
      use_interpolation: true

    # Alternative coverage controller (select with mission.yaml follow_controller_id:
    # FollowCoveragePathFTC + follow_goal_checker_id: coverage_goal_checker_ftc).
    # mowgli_nav2_plugins/FTCController (Follow-The-Carrot + decoupled PID),
    # Humble port of MowgliNext's controller. Values from MowgliNext
    # nav2_params_base.yaml unless marked TRON.
    # desired_linear_vel (set from the GUI mowing_speed via robot_settings.py
    # and live by the GUI) is a port-only alias: speed_fast = v,
    # speed_slow = clamp(0.8 v, min_speed_mps, v). -1 = use the literals.
    FollowCoveragePathFTC:
      plugin: "mowgli_nav2_plugins/FTCController"
      desired_linear_vel: 0.3
      speed_fast: 0.2
      speed_fast_threshold: 0.5
      speed_fast_threshold_angle: 10.0
      speed_slow: 0.16
      speed_angular: 15.0
      acceleration: 0.2
      obstacle_restart_angular_acceleration: 1.0
      # TRON: 0.10 (MowgliNext 0.15) so speed_slow can drop below 0.15 in turns.
      min_speed_mps: 0.1
      stall_speed_ratio: 0.35
      stall_grace_s: 0.6
      stall_crawl_speed: 0.08
      # Blade telemetry is not wired in the port (fail-open); keep disabled.
      blade_load_slowdown_enabled: false
      blade_load_rpm_full: 2500.0
      blade_load_rpm_min: 1800.0
      blade_load_min_speed_ratio: 0.4
      blade_load_telemetry_max_age_s: 1.0
      kp_lon: 1.0
      ki_lon: 0.0
      kd_lon: 0.0
      kp_lat: 1.0
      ki_lat: 0.0
      kd_lat: 0.3
      kp_ang: 1.0
      kp_ang_following: 0.8
      ki_ang: 0.0
      kd_ang: 0.0
      derivative_filter_tau: 0.2
      max_cmd_vel_speed: 0.3
      max_cmd_vel_ang: 0.3
      max_goal_distance_error: 0.5
      max_goal_angle_error: 15.0
      goal_timeout: 10.0
      max_follow_distance: 2.0
      forward_only: true
      check_obstacles: true
      obstacle_lookahead: 30
      obstacle_footprint: true
      use_footprint_clearance: false
      # TRON: front of footprint 0.52 m ahead of base_link, half width 0.27 m
      # (MowgliNext 0.30 / 0.12 for its smaller chassis).
      obstacle_footprint_front_length_m: 0.52
      require_clear_exit: true
      obstacle_body_half_width: 0.27
      obstacle_clearance_margin: 0.05
      ignore_obstacles_outside_zone: true
      enable_obstacle_deviation: true
      max_lateral_deviation: 1.5
      deviation_step: 0.05
      deviation_blend_rate: 0.5
      obstacle_wait_timeout_s: 2.5
      obstacle_clear_hold_s: 1.5
      obstacle_reverse_enabled: true
      obstacle_reverse_max_dist_m: 0.3
      obstacle_reverse_speed_mps: 0.1
      scale_linear_on_angular_saturation: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # DEVIATION: NavFn instead of SmacPlanner2D. With an empty global costmap
    # (inflation + keepout only) NavFn is plenty and has fewer knobs.
    # allow_unknown true: without a static map every cell outside the keepout
    # mask is unknown/free.
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # DEVIATION: no assisted_teleop (not needed; teleop goes through twist_mux).
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

# Controller output (/cmd_vel_nav_raw) -> velocity_smoother -> /cmd_vel_nav,
# the twist_mux navigation lane (priority 10, timeout 0.6 s).
# DEVIATION: MowgliNext routes cmd_vel_nav through collision_monitor; with no
# scan source a collision_monitor would be a pass-through, so it is omitted.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    use_realtime_priority: false
    smoothing_frequency: 20.0
    scale_velocities: false
    # OPEN_LOOP: smooth against the last command, not measured velocity, so the
    # smoother never stalls on a missing / late /odometry/filtered.
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [0.5, 0.0, 3.0]    # theta 3.0: do not re-ramp the RPP turn command (see max_angular_accel)
    max_decel: [-1.0, 0.0, -3.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      always_send_full_costmap: true
      footprint: "[[0.52, 0.27], [0.52, -0.27], [-0.23, -0.27], [-0.23, 0.27]]"
      footprint_padding: 0.02
      # DEVIATION: 4 x 4 m (MowgliNext 12 x 12) — only bumper hits populate it.
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      track_unknown_space: false
      # NO inflation_layer here (Humble 1.1.x bug, root cause of the first real
      # mow stalling): InflationLayer::reset() sets current_=false and only
      # updateCosts() sets it back, but with no obstacles the layered bounds are
      # empty so updateCosts() is never called. After any ClearEntireCostmap on
      # the local costmap (the default BT's FollowPath recovery),
      # isCurrent() stays false forever and controller_server::computeControl
      # spins in `while (!costmap_ros_->isCurrent())`: no cmd_vel, and every new
      # FollowPath goal is just replaced as "pending" ("[follow_path] Aborting
      # handle." with no other log). RPP collision checking only needs the
      # lethal bumper cells; the keepout margin lives in the global costmap.
      plugins: ["obstacle_layer"]
      # Bumper contacts as a marking-only obstacle source. bumper_controller
      # publishes points in base_link at z=0 (x=0.4, y in {-0.2,0,0.2}), i.e.
      # INSIDE the footprint, so footprint_clearing_enabled must be false or the
      # layer erases the hit immediately.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: false
        max_obstacle_height: 2.0
        combination_method: 1
        # bumper: contact hits. stereo: Metoak hardware-disparity cloud
        # (mower_cameras/stereo_depth, frame stereo_camera_optical, 0.2-4 m).
        # det_range: YOLO detections ranged with the stereo depth (centroids in
        # base_link, /ai/det/obstacle_points); marking only, cleared by the stereo raytrace.
        observation_sources: bumper stereo det_range
        stereo:
          topic: /stereo_depth/points
          data_type: "PointCloud2"
          sensor_frame: stereo_camera_optical
          marking: true
          clearing: true
          # The cloud is already noise-filtered and ground-removed in stereo_depth
          # (speckle + neighbour filter, per-frame RANSAC ground plane, points <0.12 m
          # above it dropped, 2-frame persistence). These limits are the second line:
          # 0.15-1.2 m above ground marks (a 30 cm box, a person's legs/torso), grass
          # and pitch-induced ground rise do not. 2.0 m max range: beyond it the
          # 0.9-deg-per-pixel disparity quantisation and body pitch while driving put
          # the lawn above 0.08 m (the 2026-10-06 "collision ahead" abort).
          # min 0.08 (was 0.15, 2026-10-06 box test): stereo_depth already drops points
          # <0.12 m above its LIVE per-frame ground plane; this height is computed again
          # against the STATIC URDF pose, which disagrees with the live fit by ~1.4 deg
          # pitch (2-3 cm at 1 m). A cardboard box at 1.3 m measured 0.08-0.15 m (only
          # its top edge >0.15), so 0.15 marked it intermittently / not at all. 0.08 only
          # guards against fit failure; the node's live-plane margin is the real filter.
          min_obstacle_height: 0.08
          max_obstacle_height: 1.2
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          # Stale clouds expire after 0.5 s instead of sticking forever; no cloud for
          # >1 s marks the layer not-current (controller pauses instead of driving on
          # stale data). Disable the source with stereo_costmap:=false (mower.launch.py)
          # to mow bumper-only.
          observation_persistence: 0.5
          expected_update_rate: 1.0
          inf_is_valid: false
        det_range:
          topic: /ai/det/obstacle_points
          data_type: "PointCloud2"
          marking: true
          clearing: false
          # Centroids sit anywhere from ~0.05 m (hedgehog) to ~1 m (person) above ground.
          min_obstacle_height: -0.5
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: false
        bumper:
          topic: /bumper_cloud
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: -0.5
          max_obstacle_height: 2.0
          obstacle_max_range: 1.0
          obstacle_min_range: 0.0
          raytrace_max_range: 1.5
          raytrace_min_range: 0.0
          observation_persistence: 2.0
          expected_update_rate: 0.0
          inf_is_valid: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      always_send_full_costmap: false
      footprint: "[[0.52, 0.27], [0.52, -0.27], [-0.23, -0.27], [-0.23, 0.27]]"
      footprint_padding: 0.02
      # No static_layer: there is no /map publisher (no LiDAR, no SLAM). Rolling
      # window in the GPS-anchored map frame; the keepout mask carries the
      # field boundary / no-go zones.
      # DEVIATION: 0.1 m resolution, 50 x 50 m (MowgliNext 0.08 m, 70 x 70 m).
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.1
      track_unknown_space: false
      # static_layer on /keepout_mask (mower_map map_server_node, latched): the
      # zone mask (lethal outside the mowing areas / on obstacles) becomes part of
      # the costmap. Needed on Humble: with only inflation_layer no layer expands
      # the update bounds, so KeepoutFilter.process() never touches a cell and the
      # costmap stayed all-free (verified on the robot 2026-10-06). In a rolling
      # window StaticLayer re-applies its full extent every cycle.
      plugins: ["static_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # /nav_keepout_mask = NAVIGATION mask (areas grown by nav_margin_m 0.35,
        # no dock keepout). /keepout_mask is the mowing mask and made the dock
        # start cell + perimeter coverage rings lethal (plans failed 2026-10-06).
        map_topic: /nav_keepout_mask
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        transform_tolerance: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # inflation_radius >= inscribed radius (0.25 m: rear edge 0.23 + padding 0.02)
        # silences "inflation radius smaller than inscribed radius" (0.26: at exactly
        # 0.25 the float-computed inscribed radius still wins, verified 2026-10-06). The nav mask
        # already carries the footprint margin (nav_margin_m 0.35), so the cost decays
        # very steeply past the inscribed band (cost_scaling_factor 25) and the
        # keepout / nav-mask behaviour is unchanged. Perimeter reachability checked
        # 2026-10-06: planner-only dock -> (-1.80, -1.29) succeeds.
        cost_scaling_factor: 25.0
        inflation_radius: 0.26
      # Filter info (/costmap_filter_info) + mask (/keepout_mask) come from the
      # ported MowgliNext map_server_node (or costmap_filter_info_server with
      # use_keepout:=true). With no publisher the filter is idle and does not
      # block lifecycle activation.
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 0.5

# Only started when use_keepout:=true (its own lifecycle manager).
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0                     # 0 = keepout
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_mask"
    base: 0.0
    multiplier: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 10.0
    # A server that crashes is respawned by launch (respawn=True); the manager then resets
    # the stack and re-activates it when all servers are back (docs/crash_recovery.md).
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 30.0   # s; Humble default 10 is short for the RK3588
    # Dependency order; must match navigation.launch.py.
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother

lifecycle_manager_costmap_filters:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 10.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 30.0
    node_names:
      - costmap_filter_info_server
