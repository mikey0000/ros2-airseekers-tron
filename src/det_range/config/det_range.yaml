# det_range: det_ros detections x Metoak hardware depth -> ranged detections + obstacles.
det_range:
  ros__parameters:
    detections_topic: /ai/det/detections
    depth_topic: /stereo_depth/depth/image_raw
    camera_info_topic: /vio/right/camera_info
    output_topic: /ai/det/detections_ranged
    obstacles_topic: /ai/det/obstacles
    obstacle_points_topic: /ai/det/obstacle_points
    # Only the right colour eye of the front stereo is ranged; the OA cameras have no
    # extrinsics in config/urdf/mower.urdf.xacro (their detections pass through unranged).
    stereo_frames: [vio_camera]
    target_frame: base_link
    depth_frame: stereo_camera_optical
    box_frac: 0.5          # sample the central 50 % of the box
    min_valid_px: 20
    min_range_m: 0.2
    max_range_m: 10.0
    z_guess_m: 2.0
    sigma_disparity_px: 0.25
    max_depth_age_s: 0.5
    # Class-size check (2026-10-13 false stop: a person several metres away ranged at 0.91 m
    # by a spurious near disparity on the lawn). For these classes the stereo range is
    # replaced by the range implied by the box height (pinhole, nominal height below) when
    # stereo < size_check_min_ratio x that range, unless the box touches the top / bottom of
    # the frame (within size_check_clip_px: height is only a lower bound) or is >=
    # size_check_tall_frac of the frame (very close). A subject shorter than nominal makes the
    # box range too FAR, i.e. stricter: a fully visible person under ~0.8 m (ratio x 1.6 m)
    # within 1 m, e.g. a sitting toddler, is ranged too far (see det_range/geometry.py).
    # size_check_min_ratio: 0.0 = off.
    size_check_classes: [person, dog, cat]
    size_check_heights_m: [1.6, 0.4, 0.25]
    size_check_min_ratio: 0.5
    size_check_clip_px: 3.0
    size_check_tall_frac: 0.85
    size_check_sigma_frac: 0.3      # replaced range: sigma = 0.3 x range
    source_image_height: 480        # right eye; camera_info overrides
    publish_obstacle_points: true   # false = empty /ai/det/obstacle_points (obstacle_detection none)
    # Cloud filter (2026-10-21, grass false stops): only these named classes at >= score put
    # a point on /ai/det/obstacle_points (costmaps + obstacle_tracker map tagging). The ranged
    # detections / PoseArray (obstacle_guard, mission) are unchanged. det_ros obj_thresh 0.25.
    # manhole left out (flat, mowable).
    points_classes: [person, dog, cat, sports ball, hedgehog, rabbit, stone, hoe, shovel,
                     brick, trashbin, toycars, potted plant, cans, bottle, book, backpack,
                     wood, chair, trunk]
    points_min_score: 0.5
    # Option B (2026-10-23 trunk incident, docs/analysis/2026-10-23_obstacle_nogo_options.md):
    # every stereo-ranged box goes on the clouds as a DISC of its visible width (box width x
    # range / fx), centred half a width behind the front face, radius width/2 + margin, on a
    # 0.05 m grid (one centroid cell let the body scrape the trunk). The STATIC classes go to
    # /ai/det/obstacle_points_static instead, which the costmaps keep for 60 s (their own
    # static_det_layer) so a trunk stays marked beside the camera and through a pivot.
    # Width also in detections_ranged results[0].pose.covariance[35] (m) for obstacle_tracker.
    static_points_topic: /ai/det/obstacle_points_static   # "" = all classes on one cloud
    static_classes: [trunk, stone, wood, brick, trashbin, potted plant, chair]
    width_points: true
    width_margin_m: 0.10
    width_spacing_m: 0.05
    max_width_m: 1.5
    # Rear camera (2026-10-09): no stereo -> monocular ground-plane range from the bbox
    # bottom-centre (det_range/geometry.py mono_range_box: ~7 %/m-ish per degree of pitch
    # error, see the accuracy notes there). Intrinsics from camera_info (taken once), pose
    # from /tf_static (URDF rear_camera_joint) with this fallback. Kept out of the Nav2
    # obstacle cloud (mono_to_costmap false); obstacle_guard uses it for the rear corridor.
    mono_frames: [rear_camera]
    mono_camera_info_topics: [/rear_camera/camera_info]
    mono_fallback_pose: [-0.201, 0.0, 0.25, -1.5707963, 0.0, 1.5707963]
    mono_ground_z_m: 0.0
    mono_max_range_m: 6.0
    mono_min_depression_deg: 2.0
    mono_sigma_px: 3.0
    mono_sigma_pitch_deg: 1.0
    mono_to_costmap: false
