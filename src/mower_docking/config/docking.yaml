# mower_docking parameters. Vendor sources in brackets:
#  [cfg]  src/mower_charge/param/cfg.yaml
#  [dc]   src/mower_task/mower_bt_nodes/config/dock_controller.yaml
#  [bin]  libmower_charge_core.so (docking::marker ctor, disassembled)
#  [doc]  docs/audit_2026-10-05/vendor_mission_layer.md s5
mower_docking:
  ros__parameters:
    cmd_vel_topic: /cmd_vel_docking          # twist_mux lane, priority 15, timeout 0.5 s
    odom_topic: /odom
    status_topic: /mower_base/status
    dock_pose_topic: /map_server_node/docking_pose   # latched PoseStamped (map frame)
    gps_status_topic: /gps/status                    # mowgli_interfaces/GnssStatus
    image_topic: /rear_camera/image_raw
    camera_info_topic: /rear_camera/camera_info
    charging_service: /charging
    navigate_action: /navigate_to_pose
    map_frame: map
    base_frame: base_link

    control_rate_hz: 20.0
    stop_burst_s: 0.5              # zeros published on every exit
    odom_timeout_s: 0.5            # older odom -> time * speed fallback
    status_timeout_s: 1.0          # stale /mower_base/status while moving -> abort
    contact_debounce_samples: 3    # [cfg] is_dock_done_num: 3

    dock_pose: [0.0, 0.0, 0.0]     # fallback [x, y, yaw] in map; [doc] dock = map origin
    approach_distance: 0.8         # [doc] undock_point (0.8, 0)
    skip_nav_to_approach: false    # bench: assume the robot already sits at the approach pose
    nav_timeout_s: 120.0
    nav_server_wait_s: 5.0

    aruco_dictionary: DICT_4X4_50  # [bin] getPredefinedDictionary(0)
    # Marker black-square side (m). [bin] stock marker_size_ = 0.04f, kept on purpose: the
    # physical square is ~0.055 m (owner, not yet measured exactly), so every marker distance
    # here reads 0.04/0.055 = 0.73 x the true one. Stock uses the same 0.04 with the same dock,
    # so the stock marker-frame thresholds (pose_check_distance 0.65, 0.05 m / 8 deg) transfer
    # unchanged. Changing it rescales every marker-derived distance: re-calibrate
    # docked_marker_offset (delete calibration_file, dock once in daylight) and rescale
    # pose_check_distance, final_zone, slow_distance/slow_zone, final_max_lateral,
    # max_lateral_error, kf_max_innov_m (README "marker_size").
    marker_size: 0.04
    marker_id: -1                  # -1 = any id
    # Pose of the rear camera OPTICAL frame in base_link: x y z roll pitch yaw.
    # = URDF rear_camera_joint (config/urdf/mower.urdf.xacro). TODO(calib).
    rear_camera_T_base: [-0.201, 0.0, 0.25, -1.5707963, 0.0, 1.5707963]
    # Rotates the extrinsic about the vertical through the camera. 0 since 2026-10-23: the
    # -6.5 of 2026-10-21 night was fitted on the marker NORMAL, whose bias depends on range
    # (2026-10-23 daylight vs RTK: -1.3 deg < 0.15 m, -3.7 deg at 0.6-1 m, -7 deg > 1 m), not
    # a camera yaw. With 0 the marker CENTRE + RTK heading gives the RTK lateral within 1.3 cm
    # at every range (260 detections); with -6.5 it read 4-14 cm off and the filter heading
    # +4.8 deg, so the reverse controller settled at lateral = bias / k_lateral = +4..6 cm and
    # the robot missed the contacts (findings doc, "Lateral offset at the contacts").
    rear_camera_yaw_correction_deg: 0.0
    max_detection_rate_hz: 10.0
    search_timeout_s: 15.0         # no usable marker -> dead-reckon
    # Old search gate (0.5 m / 25 deg). Stock's CheckInitJump has no call site: OFF since
    # 2026-10-21 (use_marker_gate false: any detection starts DOCKING; the Kalman filter's
    # innovation clamp handles outliers). The values still bound ALIGNING's early exit.
    use_marker_gate: false
    search_min_detections: 3       # consistent detections before DOCKING (2026-10-21: 1 let a
    #                                 -167 deg first solve start DOCKING; 3 same-side IPPE flips
    #                                 in a row ~0.3 %)
    max_lateral_error: 0.5         # [doc] reject estimate worse than 0.5 m
    max_yaw_error_deg: 25.0        # [doc] ... or 25 deg
    marker_timeout_s: 0.5
    max_lost_frames: 20            # control ticks without a usable marker -> RETRY
    # Distance from the marker plane to base_link (rear axle) along the marker
    # normal when the robot sits on the contacts. PLACEHOLDER - calibrate (README).
    docked_marker_offset: 0.45

    max_speed: 0.15                # hard-capped at 0.15 in code
    final_speed: 0.05              # [dc] FinalDock linear_max 0.05 (straight/blind/creep)
    slow_distance: 0.3             # remaining <= 0.3 m -> close_speed (error-scaled)
    slow_zone: 0.3                 # linear ramp 0.15 -> 0.05 m/s between 0.6 and 0.3 m
    final_zone: 0.2                # remaining <= 0.2 m: realign check; marker lost in here ->
    #                                straight reverse on the last docked heading (FINAL_DOCKING).
    #                                The controller otherwise steers on the marker to contact.
    close_speed: 0.08              # max reverse speed within slow_distance (steering on)
    lateral_slow: 0.20             # close-zone speed scales down with |lateral| / this, floor below
    marker_median_n: 3             # gates/realign decisions use the median of the last 3 markers
    # 2026-10-08 dusk: lost after max_lost_frames ticks (1 s) -> RETRY loop. Now hold still
    # (no reverse) and only RETRY once the marker has been lost this long as well.
    # 2026-10-21: after lost_predict_s of reversing on the filter prediction, hold still
    # (exposure steps every exposure_lost_step_s) and RETRY after this long (was 3.0; stock 20).
    marker_lost_hold_s: 8.0
    # Gates (max_lateral_error / max_yaw_error_deg, x docking_gate_scale in DOCKING) compare
    # the heading with the reverse controller's desired approach heading
    # clamp(k_lateral * lateral, max_approach_angle), not with the raw dock axis.
    # 2026-10-07 retune (closed-loop sim: 0.5 m out, 8 cm / 8 deg -> <1 mm / <1 deg at contact)
    k_lateral: 2.5                 # 2026-10-21 night: 7 saturated h_d from 0.07 m -> w sign flips 1-2 Hz
    max_approach_angle: 0.26       # rad, 15 deg (was 0.5 = 28.6 deg)
    max_angular_accel: 0.6         # rad/s^2 rate limit on the reverse w
    kp_heading: 1.5
    kd_heading: 0.0
    max_angular: 0.3               # [dc] Undocking angular_max 0.3
    heading_hold_kp: 1.0
    docking_timeout_s: 60.0        # [doc] "Docking timeout > 60s, retrying"
    final_timeout_s: 10.0          # [doc] FINAL_DOCKING 10 s ...
    final_max_distance: 0.30       # [doc] ... / 30 cm -> RETRY
    blind_extra_distance: 0.1      # dead-reckon approach_distance + 0.1 m
    blind_timeout_margin_s: 10.0
    max_retries: 8                 # then DOCK_MAXOUT ([doc] notice 900053); stock 8 (was 3)
    # Retry approach lines offset from the dock axis (stock): retry 1 +0.1*side, 2 -0.1*side,
    # 3 +0.2, 4 -0.2, 5 +0.3, 6 -0.3, 7 0, 8 +0.1; side = where the marker was last seen from.
    retry_lateral_offsets: [0.1, 0.2, 0.3]
    retry_forward_distance: 0.3
    retry_speed: 0.1
    retry_timeout_s: 15.0
    charging_timeout_s: 5.0

    # Safety (incident 2026-10-06: SEARCHING timed out without a marker, the blind
    # reverse along the unmeasured (0,0,0) placeholder dock yaw drove into a log).
    allow_blind_docking: false     # true = vendor behaviour: blind reverse after any search timeout
    blind_marker_max_age_s: 30.0   # blind final docking only if the dock pose is measured AND
    #                                a marker was seen this attempt within this age
    # 2026-10-08: blind reverse after a failed search is OFF in vision mode regardless of the
    # measured dock pose / earlier sighting (owner: docking is driven by the rear marker).
    # A search timeout re-approaches (Nav2 + about-turn) up to max_retries, then DOCK_NOT_FOUND.
    # Bumper during ALIGNING/SEARCHING/DOCKING/FINAL/RETRY (2026-10-08 bike vs front bumper):
    # stop, wait until the bumper is released AND bumper_controller's manoeuvre
    # (/mower_base/bumper_routing_status) is idle for bumper_clear_s, then resume from the
    # current pose (ALIGNING re-plans the about-turn; DOCKING needs a fresh in-gate marker).
    # Still pressed after bumper_wait_max_s -> DOCK_BLOCKED.
    bumper_routing_topic: /mower_base/bumper_routing_status
    bumper_clear_s: 2.0
    bumper_wait_max_s: 30.0
    # Rear obstacle (2026-10-09): obstacle_guard publishes /vision/rear_blocked (latched) for a
    # person/animal in the reverse corridor BETWEEN the robot and the dock (anyone at, beside
    # or behind the charger is ignored there). SEARCHING/DOCKING/FINAL_DOCKING hold still,
    # timers paused, resume rear_clear_s after it clears; > rear_wait_max_s -> DOCK_BLOCKED.
    rear_blocked_topic: /vision/rear_blocked
    rear_hold: true
    rear_clear_s: 1.5
    rear_wait_max_s: 60.0
    dock_pose_measured_topic: /map_server_node/docking_pose_measured   # latched Bool
    dock_pose_measured_override: false   # bench only
    # stall / dig guard in DOCKING / FINAL_DOCKING / RETRY -> FAILED "DOCK_STALLED"
    progress_odom_topic: /odometry/filtered   # fused pose used to measure real progress
    stall_min_cmd: 0.03            # m/s; |cmd| above this counts
    stall_progress_ratio: 0.2      # measured < 20 % of commanded distance ...
    stall_timeout_s: 1.0           # ... over this window -> stall
    stall_turn_radius_m: 0.2       # pivot wheel travel (|d yaw| * r) counts as progress
    stall_contact_grace_s: 3.0     # DOCKING/FINAL stall: hold, wait for ANY contact, then fail
    post_fail_contact_s: 10.0      # failed goal + is_docking_done within this -> enable charging
    # Approach shortcuts (2026-10-07: Nav2 "Failed to make progress" 0.25 m from the approach
    # pose, the remaining in-place pivot does not turn on turf -> cancel/re-send loop).
    map_pose_topic: /odometry/filtered_map   # map-frame pose for the distance/yaw checks
    approach_skip_radius_m: 0.6    # goal starts this close to the approach pose: no Nav2 leg
    inplace_search_retry: true     # search timeout within approach_skip_radius_m: align in place + search again once (no Nav2)
    nav_fail_arrived_radius_m: 1.0 # Nav2 fails/times out within this: treat as arrived
    relaxed_nav_retry: true        # beyond it: one Nav2 retry with the CURRENT yaw (no pivot)
    # Owner rule: go in front of the dock FACING it (Nav2 goal yaw = dock yaw + 180 deg,
    # natural arrival, no end-of-path spin), then about-turn in place so the rear camera
    # faces the dock.
    approach_facing_dock: true
    # ALIGNING (heading off the dock yaw by more than max_yaw_error_deg): true pivot, the
    # shorter way round, until within align_tolerance_deg (a marker sighting no longer ends it)
    align_angular: 0.3             # rad/s: the pivot floor 0.06 / (0.40 / 2) = 0.3 since 2026-10-20 (0.25 = 0.05 m/s per wheel, under the floor)
    align_creep: 0.0               # m/s forward while turning (0 = pure pivot)
    align_max_travel: 0.4          # m, then SEARCHING anyway (the marker decides)
    align_timeout_s: 25.0
    align_tolerance_deg: 10.0      # stop turning within this of the dock yaw
    align_to_marker_bearing: true  # dock measured: align the rear camera onto the marker's RTK bearing (+-25 deg FOV)
    # Reverse controller tolerance for a gate-edge start (25 deg / 0.5 m)
    turn_slow_err: 0.5             # rad heading-tracking error -> reverse speed at the floor
    min_turn_speed: 0.035          # m/s reverse speed floor; > stall_min_cmd so the guard stays armed
    docking_gate_scale: 1.4        # gate widened x1.4 once DOCKING (hysteresis)
    # 2026-10-07 first live dock: two 20 s realign loops for 8 cm / 8 deg. Now the reverse
    # controller corrects to contact; forward realign only when BADLY off at final_zone.
    # 2026-10-21 stock pose check: once per approach at pose_check_distance (MARKER distance
    # = remaining + docked_marker_offset, 0 = the old every-tick final_zone check), lateral
    # over final_max_lateral or heading over final_max_heading_deg -> drive forward
    # realign_forward_distance and restart the final approach (was 0.15 m / 20 deg / 0.8 m).
    pose_check_distance: 0.65
    final_max_lateral: 0.08        # pose check on the median of the last pose_check_median_n detections
    final_max_heading_deg: 12.0    # (camera yaw corrected; 8 deg on single detections failed every check)
    pose_check_median_n: 5
    max_realigns: 2                # per goal; does not consume max_retries
    # Near-field check (stock FINE_TUNING: < 0.018 m / 9 deg below 0.25 m, else 0.5 m forward):
    # once per approach at near_check_remaining (filter) with the marker in view, the median of
    # the last pose_check_median_n detections must be within these before the blind finish;
    # else forward near_check_forward (corridor cap, arcing toward the axis) and re-approach,
    # at most near_check_max_realigns per goal. 2026-10-23: blind 4.9-9.6 cm off, no contact.
    near_check_remaining: 0.25     # 0 = off
    near_check_max_lateral: 0.02
    near_check_max_heading_deg: 9.0
    near_check_forward: 0.50
    near_check_max_realigns: 2
    realign_forward_distance: 0.40 # 2026-10-23: was 0.65 (less forward driving)
    realign_forward_per_lateral: 1.5  # badly off: max(0.40, 1.5 x |lateral|) ...
    realign_forward_max: 0.65      # ... at most this (and the corridor cap)
    realign_steer: true            # realign forward arcs back toward the axis (lateral_align_k / _max_angle, wheel floor)
    # Marker Kalman filter (stock LineTrackingDocking): state = robot in the docked frame,
    # predicted from /odom, corrected per detection; innovations clamped (IPPE flips).
    marker_filter: true
    kf_q: 0.01                     # m^2 per SECOND in the gated mode (was per 20 Hz tick)
    kf_r: 0.05                     # m^2 on the median-of-3 position (field inlier lateral sd 0.08 m;
    #                                 lower follows the noise: more w sign changes in the replay)
    kf_gate_chi2: 9.21             # Mahalanobis gate, position 2-DOF 99 % (0 = stock clamping)
    kf_gate_chi2_heading: 3.84     # heading 1-DOF 95 %: a 22 deg flip is rejected
    kf_q_heading: 0.0005           # rad^2/s
    kf_r_heading: 0.006            # rad^2 (4.4 deg; field inliers 3.9 deg)
    kf_reinit_after: 8             # 3/4 of the last 8 rejected but consistent -> restart on them
    marker_position_only: true     # position from the marker centre with the filter heading
    search_consistency_deg: 10.0
    search_consistency_m: 0.15
    rtk_check_max_deg: 30.0        # detections vs RTK (dock measured, RTK fixed); 0 = off
    rtk_check_max_m: 0.3
    forward_cap_margin: 0.10       # realign/retry/LATERAL_ALIGN forward never beyond approach + this (RTK); 2026-10-23: was 0.25
    teleop_topic: /cmd_vel_teleop  # joystick active -> pause; resume from the current pose
    teleop_hold: true
    teleop_clear_s: 1.5
    teleop_wait_max_s: 120.0
    kf_max_innov_m: 0.5
    kf_max_innov_deg: 20.0
    # Marker lost in DOCKING (outside final_zone): keep reversing on the prediction this long,
    # at most lost_speed (the wheel-floor arcing of reverse_control still applies), then hold.
    lost_predict_s: 2.0
    lost_speed: 0.08
    # RTK lateral pre-alignment (stock adjust step 2) before SEARCHING: > tolerance off this
    # attempt's approach line -> forward arc back onto it (both wheels >= wheel_floor at
    # lateral_align_speed), then reverse on RTK to approach_distance. Needs a measured dock
    # pose and RTK fixed.
    lateral_align: true
    lateral_align_require_rtk: true
    lateral_align_tolerance: 0.25  # 2026-10-23: was 0.15
    lateral_align_max_heading_deg: 15.0  # only pre-align this close to the dock yaw (was a fixed 45)
    lateral_align_skip_if_marker: true   # marker in view: no pre-alignment, KF + controller fix lateral
    lateral_align_done: 0.04
    lateral_align_heading_deg: 8.0
    lateral_align_speed: 0.12
    lateral_align_k: 2.0
    lateral_align_max_angle: 0.5
    lateral_align_max_travel: 1.5
    lateral_align_timeout_s: 40.0
    # Rear exposure stepping (stock): auto, then manual exposure_absolute through
    # exposure_sequence when the detection ratio over exposure_window_s is <= the threshold
    # in SEARCHING, and every exposure_lost_step_s while the marker is lost in DOCKING. A
    # dark first frame (mean grey < exposure_dark_brightness) starts on manual
    # exposure_dark_start. Auto is restored at the end of the dock goal and after undock.
    # Sent as std_msgs/Int32 (-1 = auto) to mower_cameras (rear_exposure_control).
    exposure_control: true
    exposure_cmd_topic: /rear_camera/exposure_cmd
    exposure_sequence: [100, 90, 80, 30, 20, 10, 5, 2, 1]
    exposure_window_s: 3.0
    exposure_min_frames: 10
    exposure_ratio_threshold: 0.2
    exposure_lost_step_s: 1.0
    exposure_dark_brightness: 50.0
    exposure_dark_start: 30
    # ~/debug_image/compressed (grey JPEG of the detector input) while a dock goal runs
    debug_image_hz: 1.0
    debug_image_quality: 70
    # FINAL budget used without contact (2026-10-07 Home: the retry drove forward off the
    # pins 7 s before the contacts reported): hold, then creep further, only then retry.
    # Any contact (debounced, or is_charging) in any state stops and confirms; a raw
    # undebounced contact holds still.
    contact_settle_s: 3.0
    final_extra_creep_m: 0.15
    # docked_marker_offset auto-calibration (last marker distance - distance driven since)
    auto_calibrate_marker_offset: true
    dock_yaw_measure: true         # fit the dock yaw from every forward undock (RTK track chord)
    auto_apply_measured_dock_yaw: false   # true: send it to set_docking_point after the next dock
    set_docking_point_service: /map_server_node/set_docking_point
    calibration_file: /userdata/ros2/calibration/docking_calibration.yaml   # overrides the value above
    calib_max_marker_age_s: 15.0
    calib_min_offset: 0.2
    calib_max_offset: 1.2

    undock_direction: 1.0          # +1 = leave forwards (robot reversed onto the dock)
    undock_max_speed: 0.3          # [dc] Undocking linear_max 0.3
